<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheat Sheet — Ericka Portal</title>
<link rel="stylesheet" href="ericka.css">
<style>
  .reader{max-width:820px;margin:0 auto;padding:30px 24px 70px}
  .reader .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--violet);text-decoration:none;margin-bottom:18px}
  .sec{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:22px 24px;margin-bottom:16px}
  .sec h3{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--ink);margin-bottom:12px}
  .md{font-size:14.5px;line-height:1.65;color:#33303a}
  .md p{margin:0 0 10px}.md ul,.md ol{margin:0 0 10px 20px}.md li{margin:4px 0}
  .md strong{color:var(--ink)}
  .md blockquote{border-left:3px solid var(--gold);background:var(--cream);margin:0 0 10px;padding:8px 14px;border-radius:0 8px 8px 0}
  .md table{width:100%;border-collapse:collapse;margin:0 0 10px;font-size:13px}
  .md th,.md td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  .md th{background:var(--cream);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey)}
</style>
</head>
<body>
<div class="reader">
  <a class="back" id="back" href="05_va_home.html">← Back</a>
  <div style="margin-bottom:16px">
    <div class="chip chip-medical" style="margin-bottom:10px">Quick reference</div>
    <h1 style="font-family:var(--f-display);font-weight:600;font-size:28px;color:var(--ink)" id="title">Cheat Sheet</h1>
    <p style="color:var(--grey);font-size:13px;margin-top:6px">Keep this open while you work — everything you need at a glance.</p>
  </div>
  <div id="sections"><div class="sec" style="color:var(--grey)">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  if (!ericka.ready()) return;
  const s = ericka.requireRole(['va','admin','team_lead','client_admin']);
  if (!s) return;

  document.getElementById('back').href = ericka.homeFor(s.role);

  // VAs may only see their OWN site's sheet; managers can pass ?site=
  let site;
  if (s.role === 'va') {
    site = s.site;
  } else {
    site = new URLSearchParams(location.search).get('site') || 'Footscray';
  }

  const wrap = document.getElementById('sections');
  if (!site) {
    wrap.innerHTML = '<div class="sec" style="color:var(--grey)">No cheat sheet is assigned to your site yet.</div>';
    return;
  }
  document.getElementById('title').textContent = site + ' Cheat Sheet';

  const secs = await ericka.cheatsheetForSite(site);
  wrap.innerHTML = secs.length
    ? secs.map(function (sec) {
        return '<div class="sec">' + (sec.heading ? '<h3>' + sec.heading + '</h3>' : '')
          + '<div class="md">' + marked.parse(sec.body || '') + '</div></div>';
      }).join('')
    : '<div class="sec" style="color:var(--grey)">No cheat sheet content for ' + site + ' yet.</div>';
})();
</script>
</body>
</html>
