<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — Ericka Portal</title>
<link rel="stylesheet" href="ericka.css">
<style>
  .mini{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--grey)}
  /* The Tanda-style grid: a name rail, then one column per day. */
  .rgrid{display:grid;grid-template-columns:190px repeat(var(--days),minmax(132px,1fr));
    min-width:940px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff}
  .rscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-sm);border-radius:var(--r-lg)}
  .rhead{background:var(--mist);padding:10px 12px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:2}
  .rhead .d{font-size:13px;font-weight:700;color:var(--ink)}
  .rhead .h{font-size:11px;font-weight:700;color:var(--violet);margin-top:1px}
  .rhead.today{background:#efe6ff;box-shadow:inset 0 -3px 0 var(--gold)}
  .rname{padding:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    background:var(--cream);position:sticky;left:0;z-index:1}
  .rname b{font-size:13.5px;display:block;line-height:1.3}
  .rname .s{font-size:11px;color:var(--grey)}
  .rcell{padding:7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    min-height:62px;display:flex;flex-direction:column;gap:5px}
  .rcell:hover{background:#faf7ff}
  .grouprow{grid-column:1/-1;background:var(--violet-dd);color:#fff;padding:8px 14px;
    font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:center}
  .grouprow .gh{color:var(--lilt);font-weight:600;letter-spacing:0;text-transform:none}
  /* A shift card. Violet for a medical seat, gold for dental — same language
     the rest of the portal uses for verticals. */
  .shift{background:#efe8fa;border-left:4px solid var(--violet);border-radius:7px;
    padding:5px 8px;font-size:11.5px;line-height:1.35;position:relative}
  .shift.dental{background:#fbf1de;border-left-color:var(--gold)}
  .shift .t{font-weight:700;color:var(--ink)}
  .shift .l{color:var(--grey);font-size:10.5px}
  .shift .x{position:absolute;top:2px;right:4px;border:none;background:none;color:var(--grey);
    cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
  .shift .x:hover{color:var(--danger)}
  .addbtn{border:1.5px dashed var(--line);background:none;border-radius:7px;color:var(--grey);
    font-size:17px;cursor:pointer;padding:3px 0;font-weight:400}
  .addbtn:hover{border-color:var(--violet);color:var(--violet);background:#faf7ff}
  .copybtn{margin-top:6px;border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:10.5px;font-weight:700;color:var(--grey);cursor:pointer;padding:3px 8px;
    font-family:var(--f-body)}
  .copybtn:hover{border-color:var(--violet);color:var(--violet)}
  .sitetabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .sitetab{padding:9px 18px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:600;color:var(--grey);cursor:pointer;font-family:var(--f-body)}
  .sitetab.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .modal-back{position:fixed;inset:0;background:rgba(36,27,51,.55);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:200}
  .modal-card{background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:100%;
    max-width:420px;padding:26px;position:relative}
  .modal-x{position:absolute;top:14px;right:16px;border:none;background:none;font-size:26px;
    color:var(--grey);cursor:pointer}
  @media(max-width:640px){ .rgrid{min-width:820px} }
</style>
</head>
<body>

<input type="checkbox" id="navtog">
<div class="app-topbar">
  <label class="burger" for="navtog"><span></span><span></span><span></span></label>
  <div class="wm rev">Erick<span class="a">a</span></div>
</div>

<nav class="app-sidebar">
  <div class="sidebar-brand">
    <div class="wm rev">Erick<span class="a">a</span></div>
    <svg class="pulse" viewBox="0 0 90 14" preserveAspectRatio="none"><path d="M2 7 H32 l4 -5 l5 10 l4 -8 l3 3 H88"/></svg>
  </div>
  <div class="nav-group-label" id="nav-label">Manage</div>
  <a id="nav-home" href="02_home.html"><span class="ic">🏠</span> Home</a>
  <a id="nav-team" href="10_team.html"><span class="ic">👥</span> Team</a>
  <a href="09_roster.html" class="active"><span class="ic">🗓️</span> Roster</a>
  <a id="nav-appr" href="12_approvals.html" style="display:none"><span class="ic">✅</span> Approvals</a>
  <a id="nav-mine" href="07_va_timesheet.html" style="display:none"><span class="ic">🕑</span> My Timesheet</a>
  <a id="nav-exp" href="13_export.html" style="display:none"><span class="ic">📤</span> Pay Cycle</a>
  <a id="nav-perf" href="performance.html"><span class="ic">📊</span> Performance</a>
  <a href="14_review_training.html"><span class="ic">📚</span> Review Training</a>
  <a id="nav-admin" href="11_admin.html" style="display:none"><span class="ic">⚙️</span> Admin</a>
  <a href="01_welcome.html" class="logout" onclick="ericka.logout();return false;"><span class="ic">↩</span> Sign out</a>
</nav>

<div class="page">
  <div class="phead">
    <div class="phead-inner">
      <div>
        <h1>Standing Roster</h1>
        <div class="sub" id="r-sub">The regular weekly schedule — repeats every week</div>
      </div>
      <span class="chip chip-medical" id="r-total" style="padding:9px 18px;font-size:13px">—</span>
    </div>
  </div>

  <div class="wrap">
    <div id="standing-note" style="background:var(--mist);border-left:4px solid var(--violet);
      padding:13px 18px;border-radius:var(--r-md);font-size:13.5px;color:var(--violet-dd);
      margin-bottom:20px;line-height:1.55"></div>
    <div class="sitetabs" id="site-tabs"></div>
    <div class="rscroll"><div class="rgrid" id="grid"><div style="padding:26px;color:var(--grey)">Loading…</div></div></div>
    <p style="font-size:12px;color:var(--grey);margin-top:14px" id="r-foot"></p>
  </div>
</div>

<div id="shift-modal" class="modal-back" style="display:none">
  <div class="modal-card">
    <button class="modal-x" onclick="document.getElementById('shift-modal').style.display='none'">×</button>
    <div id="sm-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  if (!ericka.ready()) return;
  const s = ericka.requireRole(['admin','manager','team_lead','client_admin']);
  if (!s) return;

  // A client owner sees the roster; they don't set it. Everyone else on this
  // page is Ericka-side and edits it.
  const editable = s.role !== 'client_admin';
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // nav
  if (s.role === 'client_admin') {
    document.getElementById('nav-label').textContent = 'Your team';
    document.getElementById('nav-home').href = '08_client_home.html';
    document.getElementById('nav-team').style.display = 'none';
  }
  if (s.role === 'admin') {
    document.getElementById('nav-admin').style.display = '';
    document.getElementById('nav-exp').style.display = '';
  }
  if (ericka.canApprove(s) && s.role !== 'admin') {
    document.getElementById('nav-home').style.display = 'none';
  }
  if (ericka.canApprove(s)) document.getElementById('nav-appr').style.display = '';
  if (ericka.isOperator(s)) document.getElementById('nav-mine').style.display = '';
  if (s.role === 'manager' || s.role === 'team_lead') {
    document.getElementById('nav-admin').style.display = '';
    document.getElementById('nav-exp').style.display = '';
  }

  // Mon–Fri is the working week; Sat/Sun only appear if something is rostered
  // there, so the grid stays readable instead of carrying two dead columns.
  let DAYS = 5;
  let people = [], roster = new Map(), site = 'All';

  async function load() {
    let q = sb.from('users')
      .select('id,name,site,vertical,client_id,rostered_hours,role,is_operator')
      .eq('active', true).eq('is_demo', false)
      .or('role.eq.va,is_operator.eq.true');
    // A client owner only ever sees their own people.
    if (s.role === 'client_admin') q = q.eq('client_id', s.client_id);
    const { data, error } = await q.order('site').order('name');
    if (error) { document.getElementById('grid').innerHTML =
      '<div style="padding:26px;color:var(--danger)">Could not load the team: ' + esc(error.message) + '</div>'; return; }
    people = data || [];
    roster = await ericka.rosterForMany(people.map(p => p.id));
    DAYS = 5;
    roster.forEach(list => list.forEach(sh => { if (sh.weekday >= 5) DAYS = 7; }));
    render();
  }

  function sites() {
    return ['All', ...[...new Set(people.map(p => p.site || 'Unassigned'))].sort()];
  }
  function visible() {
    return site === 'All' ? people : people.filter(p => (p.site || 'Unassigned') === site);
  }

  function renderTabs() {
    document.getElementById('site-tabs').innerHTML = sites().map(x =>
      '<button class="sitetab' + (x === site ? ' on' : '') + '" data-s="' + esc(x) + '">' +
      esc(x) + '</button>').join('');
    document.querySelectorAll('.sitetab').forEach(b => b.onclick = function () {
      site = this.dataset.s; render();
    });
  }

  function dayHeader() {
    const mon = ericka.mondayOf(new Date());
    const todayIdx = (new Date().getDay() + 6) % 7;
    let html = '<div class="rhead" style="border-right:1px solid var(--line)"><div class="d">Team member</div>' +
               '<div class="h">rostered / week</div></div>';
    for (let i = 0; i < DAYS; i++) {
      const d = new Date(mon); d.setDate(d.getDate() + i);
      // total rostered across everyone visible, for this day
      let tot = 0;
      visible().forEach(p => (roster.get(p.id) || []).forEach(sh => {
        if (sh.weekday === i) tot += ericka.shiftLength(sh);
      }));
      html += '<div class="rhead' + (i === todayIdx ? ' today' : '') + '">' +
        '<div class="d">' + ericka.DAY_NAMES[i] + ' ' + d.getDate() + '</div>' +
        '<div class="h">' + (tot ? tot.toFixed(2).replace(/\.?0+$/, '') + 'h' : '—') + '</div></div>';
    }
    return html;
  }

  function shiftCard(p, sh) {
    return '<div class="shift' + (p.vertical === 'dental' ? ' dental' : '') + '">' +
      (editable ? '<button class="x" data-del="' + sh.id + '" title="Remove">×</button>' : '') +
      '<div class="t">' + ericka.fmtTime(sh.start_time) + ' – ' + ericka.fmtTime(sh.end_time) + '</div>' +
      '<div class="l">' + ericka.shiftLength(sh).toFixed(2).replace(/\.?0+$/, '') + 'h</div></div>';
  }

  function render() {
    renderTabs();
    const list = visible();
    const grid = document.getElementById('grid');
    grid.style.setProperty('--days', DAYS);

    if (!list.length) {
      grid.innerHTML = '<div style="padding:26px;color:var(--grey)">Nobody at this site yet.</div>';
      return;
    }

    // Group by site the way Tanda groups by team, unless we're already filtered.
    const groups = {};
    list.forEach(p => { const k = p.site || 'Unassigned'; (groups[k] = groups[k] || []).push(p); });

    let html = dayHeader();
    let grandTotal = 0;
    Object.keys(groups).sort().forEach(function (g) {
      const gp = groups[g];
      const gh = gp.reduce((t, p) => t + ericka.rosterByDay(roster.get(p.id) || [])
        .reduce((a, b) => a + b, 0), 0);
      grandTotal += gh;
      html += '<div class="grouprow"><span>📍 ' + esc(g) + '</span>' +
              '<span class="gh">' + gp.length + ' ' + (gp.length === 1 ? 'person' : 'people') +
              ' · ' + gh.toFixed(2).replace(/\.?0+$/, '') + 'h</span></div>';
      gp.forEach(function (p) {
        const mine = roster.get(p.id) || [];
        const wk = mine.reduce((t, sh) => t + ericka.shiftLength(sh), 0);
        html += '<div class="rname"><b>' + esc(p.name) + '</b><span class="s">' +
          (p.is_operator ? 'Manager · on a seat' : (p.vertical === 'dental' ? 'Dental' : 'Medical')) +
          ' · ' + (wk ? wk.toFixed(2).replace(/\.?0+$/, '') + 'h / wk' : 'no roster') + '</span>' +
          (editable ? '<button class="copybtn" data-copy="' + p.id + '">' +
             (wk ? 'Clear' : 'Copy from…') + '</button>' : '') +
          '</div>';
        for (let d = 0; d < DAYS; d++) {
          const todays = mine.filter(sh => sh.weekday === d);
          html += '<div class="rcell">' + todays.map(sh => shiftCard(p, sh)).join('') +
            (editable ? '<button class="addbtn" data-add="' + p.id + '" data-day="' + d + '">+</button>' : '') +
            '</div>';
        }
      });
    });
    grid.innerHTML = html;

    document.getElementById('r-total').textContent =
      grandTotal.toFixed(2).replace(/\.?0+$/, '') + ' h rostered / week';
    const noRoster = list.filter(p => !(roster.get(p.id) || []).length);
    document.getElementById('r-foot').innerHTML = noRoster.length
      ? '⚠️ <b>' + noRoster.length + '</b> with no roster set: ' +
        esc(noRoster.map(p => p.name).join(', ')) +
        '. Their client card reads "No roster set" until a shift is added here.'
      : 'Weekly totals feed straight through to each person’s card on the client portal.';

    document.getElementById('standing-note').innerHTML = editable
      ? '<b>This is the standing roster.</b> Whatever you set here repeats <b>every week</b> — ' +
        'nobody has to re-enter it. Change it only when someone\'s regular days actually change, ' +
        'and it applies from that moment forward.<br>' +
        'A <b>one-off extra shift</b> doesn\'t belong here: the VA simply clocks the hours, and you ' +
        'clear them on <a href="12_approvals.html" style="color:var(--violet-d)"><b>Approvals</b></a> ' +
        'by recording Rad or Nikki\'s authorisation for that week. That keeps the base roster stable ' +
        'and the extra time evidenced.'
      : '<b>The standing roster</b> — your team\'s regular weekly schedule. Hours worked above it ' +
        'appear on each person\'s card and are only billed once authorised.';

    if (!editable) return;
    grid.querySelectorAll('[data-copy]').forEach(b => b.onclick = function () {
      const p = people.find(x => x.id === this.dataset.copy);
      if ((roster.get(p.id) || []).length) clearRoster(p); else openCopy(p);
    });
    grid.querySelectorAll('[data-add]').forEach(b => b.onclick = function () {
      openAdd(people.find(p => p.id === this.dataset.add), Number(this.dataset.day));
    });
    grid.querySelectorAll('[data-del]').forEach(b => b.onclick = function () {
      removeShift(this.dataset.del);
    });
  }

  // Adding a shift copies the times of that person's most recent shift, because
  // a roster is mostly the same day repeated — you change the exception, not
  // every entry.
  function openAdd(p, day) {
    const mine = roster.get(p.id) || [];
    const last = mine.length ? mine[mine.length - 1] : null;
    document.getElementById('sm-body').innerHTML =
      '<div class="mini">Add a shift</div>' +
      '<div style="font-family:var(--f-display);font-weight:600;font-size:20px;margin:2px 0 2px">' +
        esc(p.name) + '</div>' +
      '<div style="font-size:13px;color:var(--grey);margin-bottom:16px">' +
        ericka.DAY_NAMES[day] + ' · 📍 ' + esc(p.site || 'Unassigned') + '</div>' +
      '<div style="display:flex;gap:12px">' +
        '<div style="flex:1"><label class="mini">Start</label>' +
          '<input id="sm-start" type="time" value="' + (last ? String(last.start_time).slice(0,5) : '09:00') + '" style="padding:10px 11px"></div>' +
        '<div style="flex:1"><label class="mini">Finish</label>' +
          '<input id="sm-end" type="time" value="' + (last ? String(last.end_time).slice(0,5) : '17:00') + '" style="padding:10px 11px"></div>' +
      '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer">' +
        '<input type="checkbox" id="sm-all" style="width:auto;margin:0"> Apply to Mon–Fri</label>' +
      '<div style="display:flex;align-items:center;gap:12px;margin-top:18px">' +
        '<button id="sm-save" class="btn btn-primary" style="padding:11px 24px">Add shift</button>' +
        '<span id="sm-msg" style="font-size:13px;font-weight:700"></span></div>';
    document.getElementById('shift-modal').style.display = 'flex';
    document.getElementById('sm-save').onclick = async function () {
      const msg = document.getElementById('sm-msg');
      const st = document.getElementById('sm-start').value;
      const en = document.getElementById('sm-end').value;
      const all = document.getElementById('sm-all').checked;
      const days = all ? [0,1,2,3,4] : [day];
      if (!st || !en) {
        msg.style.color = 'var(--danger)'; msg.textContent = 'Give it a start and a finish.'; return;
      }
      if (ericka.timeToHours(en) <= ericka.timeToHours(st)) {
        msg.style.color = 'var(--danger)';
        msg.textContent = 'Finish has to be later than start.'; return;
      }
      const existing = (roster.get(p.id) || []).map(x =>
        ({ weekday: x.weekday, start_time: x.start_time, end_time: x.end_time }));
      // "Apply to Mon–Fri" fills the EMPTY days only. On a single day, an
      // overlap is rejected outright — accepting the pre-filled 9-5 twice used
      // to make that Monday 16 h and quietly lift the approvals ceiling.
      const clashes = d => existing.some(x => x.weekday === d &&
        ericka.timeToHours(x.start_time) < ericka.timeToHours(en) &&
        ericka.timeToHours(st) < ericka.timeToHours(x.end_time));
      if (!all && clashes(day)) {
        msg.style.color = 'var(--danger)';
        msg.textContent = ericka.DAY_NAMES[day] + ' already has a shift over those hours.'; return;
      }
      const add = days.filter(d => !existing.some(x => x.weekday === d) || (!all && d === day))
                      .map(d => ({ weekday: d, start_time: st, end_time: en }));
      if (!add.length) {
        msg.style.color = 'var(--warn)';
        msg.textContent = 'Every weekday already has a shift.'; return;
      }
      this.disabled = true;
      try {
        await ericka.saveRoster(p.id, existing.concat(add));
        document.getElementById('shift-modal').style.display = 'none';
        await load();
      } catch (e) {
        msg.style.color = 'var(--danger)'; msg.textContent = e.message || String(e);
        this.disabled = false;
      }
    };
  }

  // Most of the team works the same pattern, so setting up the sixth person
  // should be one click off the first — not five modals.
  function openCopy(p) {
    const sources = people.filter(x => x.id !== p.id && (roster.get(x.id) || []).length);
    document.getElementById('sm-body').innerHTML =
      '<div class="mini">Copy a standing roster</div>' +
      '<div style="font-family:var(--f-display);font-weight:600;font-size:20px;margin:2px 0 12px">' +
        esc(p.name) + '</div>' +
      (sources.length
        ? '<label class="mini">Copy whose pattern?</label>' +
          '<select id="cp-src" style="padding:10px 11px">' + sources.map(x =>
            '<option value="' + x.id + '">' + esc(x.name) + ' · ' +
            ericka.rosterByDay(roster.get(x.id)).reduce((a,b) => a+b, 0)
              .toFixed(2).replace(/\.?0+$/, '') + 'h</option>').join('') + '</select>' +
          '<p style="font-size:11.5px;color:var(--grey);margin-top:10px">Copies their weekly ' +
            'pattern onto ' + esc(p.name) + '. You can adjust individual days afterwards.</p>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-top:16px">' +
            '<button id="cp-save" class="btn btn-primary" style="padding:11px 24px">Copy roster</button>' +
            '<span id="cp-msg" style="font-size:13px;font-weight:700"></span></div>'
        : '<p style="font-size:13px;color:var(--grey)">Nobody has a roster set yet to copy from. ' +
          'Build the first one with the <b>+</b> buttons — after that you can copy it onto everyone ' +
          'who works the same pattern.</p>');
    document.getElementById('shift-modal').style.display = 'flex';
    const btn = document.getElementById('cp-save');
    if (btn) btn.onclick = async function () {
      const src = document.getElementById('cp-src').value;
      const msg = document.getElementById('cp-msg');
      this.disabled = true;
      try {
        await ericka.saveRoster(p.id, (roster.get(src) || []).map(x =>
          ({ weekday: x.weekday, start_time: x.start_time, end_time: x.end_time })));
        document.getElementById('shift-modal').style.display = 'none';
        await load();
      } catch (e) {
        msg.style.color = 'var(--danger)'; msg.textContent = e.message || String(e);
        this.disabled = false;
      }
    };
  }

  async function clearRoster(p) {
    if (!confirm('Clear ' + p.name + '\'s standing roster?\n\nTheir card will read "No roster set" ' +
                 'and Approvals will have nothing to check their hours against until a new one is set.')) return;
    try { await ericka.saveRoster(p.id, []); await load(); }
    catch (e) { alert('Could not clear that roster: ' + (e.message || e)); }
  }

  async function removeShift(id) {
    let owner = null;
    roster.forEach((list, vaId) => { if (list.some(x => x.id === id)) owner = vaId; });
    if (!owner) return;
    const keep = (roster.get(owner) || []).filter(x => x.id !== id)
      .map(x => ({ weekday: x.weekday, start_time: x.start_time, end_time: x.end_time }));
    try { await ericka.saveRoster(owner, keep); await load(); }
    catch (e) { alert('Could not remove that shift: ' + (e.message || e)); }
  }

  document.getElementById('r-sub').textContent = editable
    ? 'The regular weekly schedule — set once, repeats every week'
    : 'Your remote team’s regular weekly schedule';
  load();
})();
</script>
</body>
</html>
