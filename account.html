<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Ericka Team Portal</title>
<link rel="stylesheet" href="ericka.css">
<style>
  .acc-wrap{max-width:440px;margin:0 auto;padding:40px 20px 70px}
  .acc-wrap .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--violet);text-decoration:none;margin-bottom:18px}
  .fld{display:block;margin-bottom:14px}
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--grey);margin-bottom:5px}
  .fld input{width:100%;padding:12px}
  .msg-ok{color:var(--ok)}.msg-err{color:var(--danger)}
</style>
</head>
<body>
<div class="acc-wrap">
  <a class="back" id="back" href="05_va_home.html">← Back</a>
  <div class="wm" style="font-size:26px;margin-bottom:4px">Erick<span class="a">a</span></div>
  <h1 style="font-family:var(--f-display);font-weight:600;font-size:24px;color:var(--ink);margin:14px 0 4px">My account</h1>
  <p style="color:var(--grey);font-size:13px;margin-bottom:22px">Signed in as <b id="who">…</b>. Change your PIN below — keep it private.</p>

  <div class="panel" style="padding:22px">
    <div class="fld"><label for="p1">New PIN</label>
      <input id="p1" type="password" inputmode="numeric" placeholder="4–6 digits" autocomplete="off"></div>
    <div class="fld"><label for="p2">Confirm new PIN</label>
      <input id="p2" type="password" inputmode="numeric" placeholder="Re-enter PIN" autocomplete="off"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
      <button id="save" class="btn btn-primary" style="padding:12px 26px">Save new PIN</button>
      <span id="msg" style="font-size:13px;font-weight:700"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  if (!ericka.ready()) return;
  const s = ericka.requireRole();              // any signed-in user
  if (!s) return;
  document.getElementById('back').href = ericka.homeFor(s.role);
  document.getElementById('who').textContent = s.name;

  const msg = document.getElementById('msg');
  document.getElementById('save').addEventListener('click', async function () {
    const p1 = document.getElementById('p1').value.trim();
    const p2 = document.getElementById('p2').value.trim();
    msg.className = 'msg-err';
    if (!/^\d{4,6}$/.test(p1)) { msg.textContent = 'PIN must be 4–6 digits.'; return; }
    if (p1 !== p2)            { msg.textContent = "PINs don't match."; return; }
    try {
      await ericka.changeMyPin(s.id, p1);
      msg.className = 'msg-ok'; msg.textContent = 'PIN changed ✓';
      document.getElementById('p1').value = ''; document.getElementById('p2').value = '';
    } catch (e) { msg.textContent = 'Could not save: ' + (e.message || e); }
  });
})();
</script>
</body>
</html>
